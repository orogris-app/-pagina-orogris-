<circle cx="73" cy="18" r="17" fill="none" stroke="#2e7344" stroke-width="3"/>
<text x="73" y="25" text-anchor="middle" font-size="21" fill="#2e7344" font-weight="800">$</text>
</g>
</g>
<rect x="43" y="1044" width="874" height="218" rx="22" fill="#ecf2eb" stroke="#cbdace" stroke-width="2"/>
<text x="69" y="1090" fill="#173f2b" font-size="29" font-weight="800" font-family="Arial">¿Qué documentos necesitas?</text>
<g font-family="Arial" font-size="21" fill="#293d31">
<circle cx="81" cy="1134" r="11" fill="#2b7e4d"/><path d="M75 1134 l5 5 9 -11" fill="none" stroke="#fff" stroke-width="3"/><text x="104" y="1142">Fotos de la propiedad</text>
<circle cx="81" cy="1183" r="11" fill="#2b7e4d"/><path d="M75 1183 l5 5 9 -11" fill="none" stroke="#fff" stroke-width="3"/><text x="104" y="1190">Certificado de tradición y libertad</text>
<circle cx="81" cy="1231" r="11" fill="#2b7e4d"/><path d="M75 1231 l5 5 9 -11" fill="none" stroke="#fff" stroke-width="3"/><text x="104" y="1238">Paz y salvo del inmueble</text>
<circle cx="492" cy="1134" r="11" fill="#2b7e4d"/><path d="M486 1134 l5 5 9 -11" fill="none" stroke="#fff" stroke-width="3"/><text x="515" y="1142">Ficha de avalúo catastral</text>
<circle cx="492" cy="1183" r="11" fill="#2b7e4d"/><path d="M486 1183 l5 5 9 -11" fill="none" stroke="#fff" stroke-width="3"/><text x="515" y="1190">Cédulas de identidad</text>
<text x="515" y="1238" font-size="17" fill="#5d7062">Te acompañamos con la gestión</text>
</g>
<rect x="43" y="1283" width="874" height="105" rx="19" fill="url(#green)"/>
<text x="480" y="1325" fill="#ffffff" text-anchor="middle" font-size="27" font-family="Arial" font-weight="800">¡Proceso ágil y acompañamiento personalizado!</text>
<text x="480" y="1360" fill="#d5ebd8" text-anchor="middle" font-size="20" font-family="Arial">Tú asumes el costo de la papelería y los trámites correspondientes.</text>
<text x="480" y="1426" fill="#5c6963" text-anchor="middle" font-size="14" font-family="Arial">Sujeto a estudio, aprobación, límites legales y condiciones finales del acreedor.</text>
</svg>