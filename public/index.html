/* Catalogo publico: la pagina de inicio es para clientes, no para administrar */
.catalogue{max-width:1200px;margin:0 auto;padding:18px 18px 68px}
.catalogue-header{background:#111319;border-radius:18px;padding:16px 19px;color:white;display:flex;align-items:center;justify-content:space-between;gap:15px}
.catalogue-header .brand{padding:0}
.catalogue-header .brand strong{font-size:22px}
.catalogue-header a{color:#d6d8dd;text-decoration:none;font-size:12px}
.catalogue-hero{padding:50px 12px 26px;text-align:center}
.catalogue-hero .eyebrow{color:#a17e39}
.catalogue-hero h1{font-size:clamp(30px,5vw,49px);letter-spacing:-1.8px;line-height:1.12;margin:12px 0}
.catalogue-hero p{color:#6b737d;font-size:16px;max-width:650px;margin:0 auto 22px;line-height:1.65}
.catalogue-search{display:flex;gap:10px;max-width:650px;margin:0 auto 22px}
.catalogue-search .field{flex:1}
.catalogue-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}
.catalogue-grid .property-content{padding:18px}
.catalogue-grid a.btn{margin:0 14px 14px}
.catalogue-foot{margin-top:45px;border-top:1px solid var(--line);padding-top:20px;text-align:center;color:#8b9098;font-size:12px}
.catalogue-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 18px}
.catalogue-intro h2{margin:0;font-size:21px}
@media(max-width:930px){.catalogue-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.catalogue-grid{grid-template-columns:1fr}.catalogue-header .brand strong{font-size:17px}.catalogue-hero{padding:38px 2px 18px}.catalogue-search{flex-direction:column}.catalogue{padding:12px 12px 55px}.catalogue-header{padding:9px 12px}.catalogue-header a{font-size:11px}}

@media(max-width:600px){.topbar .actions{display:flex;flex-wrap:wrap;gap:8px}.topbar .actions .btn{flex:1 1 auto;justify-content:center}.catalogue-header.neutral{justify-content:center}.portfolio-share-hint{font-size:12px}}

/* Buscador y estadísticas Orogris V5.0 */
.type-counts,.catalogue-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px}
.type-count{padding:12px 9px;border:1px solid var(--line);border-radius:12px;background:#fafbfd;text-align:center}
.type-count strong{display:block;font-size:24px;color:#262a32}.type-count span{font-size:12px;color:#606b7a}.type-count-button{cursor:pointer;font:inherit}.type-count-button:hover,.type-count-button:focus-visible{border-color:var(--gold);background:#fff9ed;outline-offset:2px}
.catalogue-stats{margin:6px 0 22px}
.catalogue-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 auto 24px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:16px}
.catalogue-filters label{display:grid;gap:6px;font-size:12px;font-weight:700;color:#536070}.catalogue-filters .field{min-width:0;min-height:42px}
.catalogue-filters .filter-actions{grid-column:1/-1;display:flex;justify-content:flex-end}
.detail-more{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:15px;background:#fff}.detail-more h2{font-size:19px;margin:0 0 12px;color:var(--ink)}
.related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.related-grid a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.related-grid img{width:100%;height:130px;object-fit:cover;display:block}.related-grid strong,.related-grid span{display:block;margin:8px 10px;font-size:12px}.related-grid span{color:#96732f;font-weight:700}
@media(max-width:760px){.catalogue-filters{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.catalogue-filters{grid-template-columns:1fr}.related-grid{grid-template-columns:1fr 1fr}.related-grid img{height:98px}.detail-more{padding:13px}}

@media print{body{background:white}.printless,.floatingbar,.sidebar,.mobilebar,.topbar{display:none!important}.public-shell,.public-shell .detail{padding:0;border:0}.public-photos{height:350px}.public-shell{max-width:none}.detail-brand{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

/* OROGRIS 4.4 — galería táctil con scroll-snap; sin dependencias. */
.og-gallery{position:relative;width:100%;margin:14px 0 20px;min-width:0}
.og-gallery-viewport{position:relative;background:#111319;border-radius:14px;overflow:hidden}
.og-gallery-track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding:0;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
.og-gallery-track::-webkit-scrollbar{display:none}
.og-gallery-slide{position:relative;min-width:100%;width:100%;height:clamp(280px,48vw,470px);flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;align-items:center;background:#111319}
.og-gallery-slide img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.og-gallery-indicator{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#0e1115cc;color:#fff;padding:7px 12px;font-size:12px;font-weight:650;border-radius:99px;pointer-events:none;font-variant-numeric:tabular-nums}
.og-gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:42px;height:46px;z-index:2;border:0;border-radius:11px;background:#111319a8;color:white;font-size:27px;line-height:1;transition:background .15s}
.og-gallery-arrow:hover{background:#111319e3}.og-gallery-arrow.prev{left:10px}.og-gallery-arrow.next{right:10px}
.og-gallery-arrow:disabled{opacity:.15;pointer-events:none}
.og-gallery-thumbs{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:10px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#d3c19a transparent}
.og-gallery-thumb{flex:0 0 78px;height:58px;border:2px solid transparent;border-radius:9px;padding:0;overflow:hidden;background:#eee;opacity:.7}
.og-gallery-thumb.active{border-color:#caa04d;opacity:1}.og-gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.og-gallery-help{font-size:11px;text-align:center;margin:7px 0 0;color:#767e89}
.og-lightbox{position:fixed;inset:0;z-index:1000;background:#070809f7;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));color:white}
.og-lightbox-top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding-bottom:8px;font-size:13px;color:#e1e1e1}
.og-lightbox-close{border:1px solid #ffffff50;border-radius:50%;width:40px;height:40px;color:#fff;background:#1f222a;font-size:27px;line-height:1}
.og-lightbox .og-gallery{display:flex;flex-direction:column;flex:1;min-height:0;margin:0}
.og-lightbox .og-gallery-viewport{flex:1;min-height:0;display:flex;flex-direction:column;background:transparent}
.og-lightbox .og-gallery-track{flex:1;width:100%;min-height:0}
.og-lightbox .og-gallery-slide{height:100%;background:transparent}
.og-lightbox .og-gallery-slide img{cursor:default}
.og-lightbox .og-gallery-thumbs{flex:0 0 auto}
.og-lightbox .og-gallery-help{color:#c3c3c3}
.og-lightbox .og-gallery-indicator{bottom:10px}
@media(max-width:760px){.og-gallery-slide{height:clamp(240px,74vw,380px)}.og-gallery-arrow{width:34px;height:40px;font-size:24px}.og-gallery-arrow.prev{left:6px}.og-gallery-arrow.next{right:6px}.og-gallery-thumb{flex-basis:65px;height:52px}.og-lightbox .og-gallery-slide{height:100%}}
@media print{.og-gallery-arrow,.og-gallery-help,.og-gallery-thumbs,.og-gallery-indicator,.og-lightbox{display:none!important}.og-gallery-track{overflow:visible}.og-gallery-slide{display:none}.og-gallery-slide:first-child{display:flex}}


/* OROGRIS 4.8 — vista previa de enlace para estado */
.state-layout{display:grid;grid-template-columns:minmax(140px,215px) 1fr;gap:20px;align-items:start}
.state-preview{aspect-ratio:9/16;border-radius:15px;overflow:hidden;background:#171b22;display:grid;place-items:center;color:#e8e1d2;text-align:center;box-shadow:0 8px 24px #0002}
.state-preview img{width:100%;height:100%;object-fit:cover;display:block}
.state-controls{display:flex;flex-direction:column;gap:10px}.state-controls .btn{white-space:normal;width:100%}
.state-steps{font-size:12px;line-height:1.7;color:#656d78;padding-left:18px;margin:4px 0 12px}
.state-note{font-size:12px;color:#6e7884;line-height:1.6}
@media(max-width:510px){.state-layout{grid-template-columns:minmax(0,140px) minmax(0,1fr);gap:12px}.state-controls .btn{font-size:12px;padding:10px 8px}.state-steps{padding-left:17px}}

/* OROGRIS 4.9 — vista previa dinámica de propiedades */
.status-link-preview{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:#f6f7f8;border:1px solid #e6e9ed;border-radius:13px;padding:10px;margin-top:16px}
.status-link-preview img{width:120px;height:112px;object-fit:cover;border-radius:9px}
.status-link-preview strong{font-size:15px}.status-link-preview .price{font-size:19px;margin:5px 0}.status-link-preview p{margin:4px 0;font-size:12px;line-height:1.45}
@media(max-width:430px){.status-link-preview{grid-template-columns:92px 1fr}.status-link-preview img{width:92px;height:100px}.status-link-preview .price{font-size:16px}}

<body>
<div id="shell"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const ICONS={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>',plus:'<path d="M12 5v14M5 12h14"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5"/><path d="M3 16v4a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-4"/>',settings:'<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-1.93 1.93-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.52V20h-2.72v-.09a1.65 1.65 0 0 0-1-1.52 1.65 1.65 0 0 0-1.82.33l-.06.06-1.93-1.93.06-.06A1.65 1.65 0 0 0 7.84 15a1.65 1.65 0 0 0-1.52-1H6v-2.72h.09a1.65 1.65 0 0 0 1.52-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06 1.93-1.93.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.52V6h2.72v.09a1.65 1.65 0 0 0 1 1.52 1.65 1.65 0 0 0 1.82-.33l.06-.06 1.93 1.93-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.52 1H20V14h-.09a1.65 1.65 0 0 0-1.52 1z"/>',sparkles:'<path d="m12 3 1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4L12 3zM19 17l.6 1.4L21 19l-1.4.6L19 21l-.6-1.4L17 19l1.4-.6L19 17z"/>',image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 13.6 6.6 3.8M15.3 6.6l-6.6 3.8"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',arrow:'<path d="m5 12 14 0m-6-6 6 6-6 6"/>',check:'<path d="m20 6-11 11-5-5"/>',mic:'<rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',trash:'<path d="M3 6h18m-16 0 1 15h12l1-15m-10-3h6"/>',edit:'<path d="m16 4 4 4-12 12H4v-4L16 4z"/>',view:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',link:'<path d="m10 13 4-4m-6 7H6a4 4 0 0 1 0-8h4m4 0h4a4 4 0 0 1 0 8h-4"/>',logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/>',lock:'<rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2A18.8 18.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.6 3a2 2 0 0 1-.6 2L7.2 10.5a15.5 15.5 0 0 0 6.3 6.3l1.8-1.9a2 2 0 0 1 2-.6l3 .6A2 2 0 0 1 22 16.9Z"/>',back:'<path d="m15 18-6-6 6-6"/>',file:'<path d="M5 3h9l5 5v13H5zM14 3v5h5M8 13h8M8 17h8"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const I=(name)=>`<svg class="svg" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.home}</svg>`;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n===null||n===undefined||n===''?'Consultar precio':new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(+n||0);
const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const config=window.OROGRIS_CONFIG||{}; const localCFG='orogris.v3.settings'; const TOKEN='orogris.v3.auth';
let tab='inventory', items=[], editID=null, editorPhotos=[], session=null, backend='local', selectedItem=null, selectedVariant='brand', modal='', searchTerm='', filterStatus='all', db=null, tempFiles=[];
let settings={url:config.supabaseUrl||'',key:config.supabaseAnonKey||'',phone:config.contactWhatsapp||'',...readJSON(localCFG,{})};
function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')??fallback}catch{return fallback}}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3200)}
function headline(t,sub,action=''){return `<div class="topbar"><div><div class="eyebrow">Panel inmobiliario</div><h1>${esc(t)}</h1>${sub?`<p class="muted">${esc(sub)}</p>`:''}</div><div class="actions">${action}</div></div>`}
function brand(){return `<div class="brand"><img src="orogris-emblema.png" alt="Emblema Orogris"><div><strong><span class="brand-oro">ORO</span><span class="brand-gris">GRIS</span></strong><span>SOLUCIONES INMOBILIARIAS</span></div></div>`}
function sidebar(){return `<aside class="sidebar">${brand()}<div class="sidenav"><button class="nav ${tab==='inventory'?'active':''}" data-nav="inventory">${I('home')} Inventario</button><button class="nav ${tab==='editor'?'active':''}" data-nav="editor">${I('plus')} Nueva propiedad</button><button class="nav ${tab==='rentals'?'active':''}" data-nav="rentals">${I('home')} Arrendamientos</button><button class="nav ${tab==='vehicles'?'active':''}" data-nav="vehicles">${I('arrow')} Vehículos</button><button class="nav ${tab==='stats'?'active':''}" data-nav="stats">${I('view')} Estadísticas</button><button class="nav ${tab==='mortgages'?'active':''}" data-nav="mortgages">${I('file')} Hipotecas</button><button class="nav ${tab==='settings'?'active':''}" data-nav="settings">${I('settings')} Configuración</button></div><div class="sidebar-bottom"><b>Modalidad: ${backend==='cloud'?'En línea':'Prueba local'}</b><br><span class="${backend==='cloud'?'live':''}">${backend==='cloud'?'Fotografías y fichas en la nube':'Propiedades solo en este navegador'}</span><br><span>Propiedad de Orogris</span></div></aside>`}
function mobilebar(){return `<nav class="mobilebar"><button class="nav ${tab==='inventory'?'active':''}" data-nav="inventory">${I('home')}Inventario</button><button class="nav ${tab==='editor'?'active':''}" data-nav="editor">${I('plus')}Agregar</button><button class="nav ${tab==='rentals'?'active':''}" data-nav="rentals">${I('home')}Rentas</button><button class="nav ${tab==='vehicles'?'active':''}" data-nav="vehicles">${I('arrow')}Autos</button><button class="nav ${tab==='stats'?'active':''}" data-nav="stats">${I('view')}Visitas</button><button class="nav ${tab==='mortgages'?'active':''}" data-nav="mortgages">${I('file')}Hipotecas</button><button class="nav ${tab==='settings'?'active':''}" data-nav="settings">${I('settings')}Ajustes</button></nav>`}
const welcome=()=>`<section class="loginbox">${brand()}<h2>Bienvenido a tu inmobiliaria</h2><p class="muted">Administra propiedades, fotografías y fichas para colegas. Puedes empezar en modo local o conectar tu cuenta privada en la nube.</p><div class="tip info"><b>Modo local:</b> sirve para probar la aplicación inmediatamente; no crea enlaces web públicos ni contraseña segura. Guarda y respalda tus datos desde este navegador.</div><button class="btn black" style="width:100%;margin-bottom:10px" data-action="local">${I('arrow')} Abrir mi inventario de prueba</button><button class="btn" style="width:100%" data-action="showcloud">${I('lock')} Conectar mi cuenta privada en la nube</button></section>`;
function loginView(){return `<section class="loginbox">${brand()}<h2>Acceso privado Orogris</h2><p class="muted">Solo las cuentas creadas en el proyecto Supabase podrán ingresar al inventario.</p><form id="loginForm"><div class="form-field"><label>Correo electrónico</label><input class="field" id="loginEmail" type="email" required autocomplete="username" placeholder="tu@correo.com"></div><div class="form-field"><label>Contraseña</label><input class="field" id="loginPassword" type="password" required autocomplete="current-password" placeholder="Contraseña"></div><button class="btn gold" type="submit" style="width:100%">${I('lock')} Ingresar</button></form></section>`}

const TYPE_GROUPS=[{label:'Apartamentos',match:['Apartamento','Apartaestudio']},{label:'Casas',match:['Casa','Casa finca']},{label:'Lotes',match:['Lote']},{label:'Fincas',match:['Finca']},{label:'Locales',match:['Local']},{label:'Bodegas',match:['Bodega']}];
function norm(x){return String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function typeGroup(p){const t=norm(p.type);return TYPE_GROUPS.find(g=>g.match.some(v=>norm(v)===t))?.label||'Otros'}
function typeCountMarkup(arr,clickable=false){
 const card=(label,n)=>clickable?`<button type="button" class="type-count type-count-button" data-category="${esc(label)}" aria-label="Ver ${esc(label.toLowerCase())}"><strong>${n}</strong><span>${esc(label)}</span></button>`:`<div class="type-count"><strong>${n}</strong><span>${esc(label)}</span></div>`;
 return TYPE_GROUPS.map(g=>card(g.label,arr.filter(p=>typeGroup(p)===g.label).length)).join('')+card('Otros',arr.filter(p=>typeGroup(p)==='Otros').length);
}
function whatsAppContact(p){const digits=String(config.contactWhatsapp||'').replace(/\D/g,'');if(!digits)return '';return 'https://wa.me/'+digits+'?text='+encodeURIComponent('Hola, vi en Orogris el inmueble "'+p.title+'"'+(p.city?' en '+p.city:'')+'. Quisiera más información.')}
const countStat=(s)=>items.filter(x=>x.status===s).length;
function inventory(){let p=items.filter(p=>(filterStatus==='all'||p.status===filterStatus)&&[p.title,p.city,p.neighborhood,p.description].join(' ').toLowerCase().includes(searchTerm.toLowerCase()));return `${headline('Mis propiedades','Tu catálogo organizado y listo para compartir',`<button class="btn gold" data-action="portfoliostatus">${I('share')} Portafolio a mi estado</button><button class="btn" data-action="portfolio">${I('share')} Compartir portafolio</button><button class="btn black" data-nav="editor">${I('plus')} Nueva propiedad</button>`)}${backend==='local'?`<div class="tip info"><b>Estás en modo de prueba.</b> Las fotos quedan en este navegador. Para que tus colegas abran enlaces con fotografías desde WhatsApp, debes publicar la aplicación y conectar Supabase. <a href="#" data-nav="settings">Preparar publicación</a>.</div>`:''}<div class="kpis"><div class="kpi"><div class="over">Total de inmuebles ${I('home')}</div><div class="number">${items.length}</div></div><div class="kpi"><div class="over">Publicadas ${I('check')}</div><div class="number">${countStat('Publicado')}</div></div><div class="kpi"><div class="over">Borradores ${I('file')}</div><div class="number">${countStat('Borrador')}</div></div><div class="kpi"><div class="over">Fotos guardadas ${I('image')}</div><div class="number">${items.reduce((n,x)=>n+(x.photos||[]).length,0)}</div></div></div><section class="section"><div class="section-heading"><div><h2>Inmuebles por categoría</h2><p>Conteo automático del inventario.</p></div></div><div class="type-counts">${typeCountMarkup(items)}</div></section><section class="section"><div class="section-heading"><div><h2>Inventario de inmuebles</h2><p>${items.length} propiedades en tu catálogo</p></div><button class="btn small" data-action="backup">${I('download')} Respaldo</button></div><div class="filters"><input id="search" class="field" placeholder="Buscar por título, municipio o características..." value="${esc(searchTerm)}"><select class="field" id="statusFilter"><option value="all" ${filterStatus==='all'?'selected':''}>Todos los estados</option>${['Borrador','Publicado','Reservado','Vendido'].map(s=>`<option ${filterStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="gridcards" id="propertyGrid">${cards(p)}</div></section>`}
function cards(p){if(!p.length)return `<div class="empty" style="grid-column:1/-1">${I('home')}<h3>Todavía no hay inmuebles aquí</h3><p>Agrega tu primera propiedad desde el panel de administración.</p><button class="btn gold" data-nav="editor">${I('plus')} Agregar mi primera propiedad</button></div>`;return p.map(x=>`<article class="property"><div class="cover">${x.photos?.length?`<img src="${esc(x.photos[0])}" loading="lazy" alt="Foto de ${esc(x.title)}">`:`<div class="placeholder">${I('image')}Sin fotografías</div>`}<span class="pill ${x.status==='Borrador'?'draft':x.status==='Vendido'?'sold':x.status==='Reservado'?'reserved':''}">${esc(x.status)}</span>${x.photos?.length?`<span class="photo-count">${x.photos.length} fotos</span>`:''}</div><div class="property-content"><h3>${esc(x.title)}</h3><div class="muted">${esc([x.city,x.neighborhood].filter(Boolean).join(' · '))}</div><div class="price">${fmt(x.price)}</div><div class="meta"><span>${x.area?esc(x.area)+' m²':'Área por definir'}</span><span>${esc(x.rooms||'0')} hab.</span><span>${esc(x.baths||'0')} baños</span></div><p class="desc">${esc(x.description||'Sin descripción')}</p></div><div class="card-actions"><button class="btn small black" data-share="${esc(x.id)}">${I('share')} Compartir</button><button class="btn small green" data-state="${esc(x.id)}">${I('share')} Estado WhatsApp</button><button class="btn small" data-preview="${esc(x.id)}">${I('view')} Ver</button><button class="btn small" data-edit="${esc(x.id)}">${I('edit')}</button></div></article>`).join('')}
function editor(){const p=editID?items.find(x=>x.id===editID):null;return `${headline(p?'Editar inmueble':'Nueva propiedad',p?'Actualiza la ficha de tu inventario':'Sube fotos y dicta o escribe las características',`<button class="btn" data-nav="inventory">${I('back')} Volver</button>`)}<section class="section"><div class="section-heading"><div><h2>Información de la propiedad</h2><p>Solo el título es obligatorio para guardarla como borrador</p></div></div><form id="propertyForm"><div class="two-col"><div class="form-field"><label>Título del anuncio *</label><input id="f_title" class="field" required placeholder="Apartamento en La Ceja" value="${esc(p?.title||'')}"></div><div class="form-field"><label>Tipo de propiedad</label><select id="f_type" class="field">${['Apartamento','Apartaestudio','Casa','Casa finca','Finca','Lote','Local','Bodega','Otro'].map(s=>`<option ${p?.type===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="three-col"><div class="form-field"><label>Precio de venta (COP)</label><input id="f_price" class="field" type="number" min="0" placeholder="250000000" value="${esc(p?.price??'')}"></div><div class="form-field"><label>Municipio / ubicación</label><input id="f_city" class="field" placeholder="La Ceja, Antioquia" value="${esc(p?.city||'')}"></div><div class="form-field"><label>Barrio o sector (opcional)</label><input id="f_neighborhood" class="field" placeholder="Centro, Payuco..." value="${esc(p?.neighborhood||'')}"></div></div><div class="three-col"><div class="form-field"><label>Área construida (m²)</label><input id="f_area" class="field" type="number" min="0" step="0.01" value="${esc(p?.area??'')}"></div><div class="form-field"><label>Habitaciones</label><input id="f_rooms" class="field" type="number" min="0" value="${esc(p?.rooms??'')}"></div><div class="form-field"><label>Baños</label><input id="f_baths" class="field" type="number" min="0" value="${esc(p?.baths??'')}"></div></div><div class="two-col"><div class="form-field"><label>Parqueaderos</label><input id="f_parking" class="field" type="number" min="0" value="${esc(p?.parking??'')}"></div><div class="form-field"><label>Estado</label><select class="field" id="f_status">${['Borrador','Publicado','Reservado','Vendido'].map(s=>`<option ${p?.status===s?'selected':(!p&&s==='Borrador')?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="form-field"><label>Descripción comercial</label><textarea class="field" id="f_description" placeholder="Descríbela como te resulte más cómodo: por texto o con el micrófono del teclado...">${esc(p?.description||'')}</textarea><div class="quick"><button class="btn small" type="button" data-action="dictate">${I('mic')} ${IS_IOS?'Abrir teclado para dictar':'Dictar (si está disponible)'}</button><button class="btn small" type="button" data-action="extract">${I('sparkles')} Extraer datos del texto</button><small>${IS_IOS?'En iPhone: toca «Abrir teclado para dictar» y luego el micrófono del teclado de Apple. La app no activará reconocimiento de voz directo.':'También puedes usar el micrófono de tu teclado.'}</small></div></div><div class="form-field"><label>Fotografías · selecciona varias desde tu celular</label><label class="upload" for="f_photos">${I('upload')}<strong>Elegir fotos de la galería</strong><p>Selecciona varias imágenes a la vez (máximo 40 por propiedad)</p><input type="file" accept="image/*" id="f_photos" multiple></label><div id="editorThumbs" class="thumbgrid">${thumbs(editorPhotos)}</div><small id="photoStatus">${editorPhotos.length} fotografía(s) preparadas</small></div><div class="form-toolbar"><button class="btn" type="button" data-nav="inventory">Cancelar</button><button class="btn gold" type="submit">${I('check')} Guardar propiedad</button></div></form></section>${editID?`<div class="quick"><button class="btn warn" data-delete="${esc(editID)}">${I('trash')} Eliminar inmueble</button></div>`:''}`}
function thumbs(ar){return ar.map((u,i)=>`<div class="thumb"><img src="${esc(u)}" alt="Foto ${i+1}"><button type="button" data-remove-photo="${i}" aria-label="Quitar foto">×</button></div>`).join('')}

gas el mensaje. El envío directo desde «Compartir» de iPhone requiere una integración nativa o con Atajos que todavía no está instalada. <b>Integración con ChatGPT:</b> la importación directa desde este chat también está pendiente; por ahora usa copiar y pegar.</div>`}

function ogGalleryMarkup(pics, full=false){
  const im=pics.filter(src=>typeof src==='string'&&src.length>0);
  if(!im.length)return `<div class="empty">${I('image')}<p>Sin fotografías disponibles</p></div>`;
  const images=im.map((src,i)=>`<div class="og-gallery-slide"><img src="${esc(src)}" alt="Fotografía ${i+1} de ${im.length}" loading="${i===0?'eager':'lazy'}" draggable="false" data-og-open="1"></div>`).join('');
  const thumbs=im.length>1?`<div class="og-gallery-thumbs" aria-label="Miniaturas de las fotografías">${im.map((src,i)=>`<button type="button" class="og-gallery-thumb ${i===0?'active':''}" data-og-thumb="${i}" aria-label="Ver fotografía ${i+1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join('')}</div>`:'';
  return `<div class="og-gallery" data-og-gallery="1"><div class="og-gallery-viewport"><div class="og-gallery-track" aria-label="Galería de fotografías, desliza hacia los lados">${images}</div>${im.length>1?`<button type="button" class="og-gallery-arrow prev" data-og-step="-1" aria-label="Fotografía anterior" disabled>‹</button><button type="button" class="og-gallery-arrow next" data-og-step="1" aria-label="Fotografía siguiente">›</button><span class="og-gallery-indicator" aria-live="off">1 / ${im.length}</span>`:''}</div>${thumbs}<p class="og-gallery-help">${full?'Desliza para ver las siguientes fotos':'Desliza las fotos a los lados · Toca para ampliar'}</p></div>`;
}
function ogGalleryActive(g){let tr=g?.querySelector('.og-gallery-track');if(!tr)return 0;return Math.max(0,Math.min(tr.children.length-1,Math.round(tr.scrollLeft/Math.max(tr.clientWidth,1))))}
function ogGallerySync(g){const tr=g?.querySelector('.og-gallery-track');if(!tr)return;const i=ogGalleryActive(g),count=tr.children.length;
  const indicator=g.querySelector('.og-gallery-indicator');if(indicator)indicator.textContent=`${i+1} / ${count}`;
  const prev=g.querySelector('[data-og-step="-1"]'),next=g.querySelector('[data-og-step="1"]');if(prev)prev.disabled=i===0;if(next)next.disabled=i===count-1;
  g.querySelectorAll('[data-og-thumb]').forEach(b=>{const active=+b.dataset.ogThumb===i;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'true':'false')});
}
function ogGalleryGo(g,i,instant=false){const tr=g?.querySelector('.og-gallery-track');if(!tr)return;const clamped=Math.max(0,Math.min(i,tr.children.length-1));tr.scrollTo({left:clamped*tr.clientWidth,behavior:instant?'auto':'smooth'});if(instant)ogGallerySync(g)}
let ogOldScroll='',ogSwipeStart=null;
function ogOpenLightbox(g){if(document.querySelector('.og-lightbox'))return;const imgs=[...g.querySelectorAll('.og-gallery-slide img')].map(img=>img.getAttribute('src'));const current=ogGalleryActive(g);
  ogOldScroll=document.body.style.overflow;document.body.style.overflow='hidden';
  const el=document.createElement('div');el.className='og-lightbox';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Fotografías del inmueble');
  el.innerHTML=`<div class="og-lightbox-top"><span>Fotografías del inmueble</span><button class="og-lightbox-close" type="button" data-og-close="1" aria-label="Cerrar galería">×</button></div>${ogGalleryMarkup(imgs,true)}`;
  document.body.appendChild(el);const lb=el.querySelector('.og-gallery');if(lb){ogGalleryGo(lb,current,true);requestAnimationFrame(()=>ogGalleryGo(lb,current,true))}
  el.querySelector('.og-lightbox-close')?.focus({preventScroll:true});
}
function ogCloseLightbox(){document.querySelector('.og-lightbox')?.remove();document.body.style.overflow=ogOldScroll}
// Los controles y el carrusel funcionan también en fichas públicas sin sesión.
document.addEventListener('click',e=>{const target=e.target.closest('[data-og-close],[data-og-step],[data-og-thumb],[data-og-open]');if(!target)return;
  if(target.hasAttribute('data-og-close')){e.preventDefault();ogCloseLightbox();return}
  const g=target.closest('[data-og-gallery]');if(!g)return;
  if(target.hasAttribute('data-og-step')){e.preventDefault();ogGalleryGo(g,ogGalleryActive(g)+Number(target.dataset.ogStep));return}
  if(target.hasAttribute('data-og-thumb')){e.preventDefault();ogGalleryGo(g,Number(target.dataset.ogThumb));return}
  if(target.hasAttribute('data-og-open')&&!g.closest('.og-lightbox')){if(ogSwipeStart?.moved)return;e.preventDefault();ogOpenLightbox(g)}
});
document.addEventListener('touchstart',e=>{const track=e.target.closest?.('.og-gallery-track');if(!track)return;const t=e.touches?.[0];if(t)ogSwipeStart={x:t.clientX,y:t.clientY,moved:false}},{passive:true});
document.addEventListener('touchmove',e=>{if(!ogSwipeStart)return;const t=e.touches?.[0];if(t&&Math.abs(t.clientX-ogSwipeStart.x)>14)ogSwipeStart.moved=true},{passive:true});
document.addEventListener('touchend',()=>{if(ogSwipeStart?.moved)setTimeout(()=>ogSwipeStart=null,180);else ogSwipeStart=null},{passive:true});
document.addEventListener('scroll',e=>{if(e.target.classList?.contains('og-gallery-track'))ogGallerySync(e.target.closest('.og-gallery'))},true);
document.addEventListener('keydown',e=>{const lb=document.querySelector('.og-lightbox');if(!lb)return;
  if(e.key==='Escape'){e.preventDefault();ogCloseLightbox();return}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const g=lb.querySelector('.og-gallery');ogGalleryGo(g,ogGalleryActive(g)+(e.key==='ArrowLeft'?-1:1))}
});

let publicProperties=[];
async function fetchPublished(){
 const base=config.supabaseUrl.replace(/\/$/,'')+'/rest/v1/properties',headers={apikey:config.supabaseAnonKey};
 if(!config.supabaseAnonKey.startsWith('sb_'))headers.Authorization='Bearer '+config.supabaseAnonKey;
 const all=[];
 for(let offset=0;offset<10000;offset+=1000){
  const u=new URL(base);u.searchParams.set('select','id,title,type,city,neighborhood,description,price,area,rooms,baths,photos,status');u.searchParams.set('status','eq.Publicado');u.searchParams.set('order','updated_at.desc');u.searchParams.set('limit','1000');u.searchParams.set('offset',String(offset));
  const resp=await fetch(u,{headers});if(!resp.ok)throw Error('No se pudo consultar el catálogo');
  const batch=await resp.json();if(!Array.isArray(batch))throw Error('Respuesta inválida del catálogo');
  for(const p of batch){if(typeof p.photos==='string'){try{p.photos=JSON.parse(p.photos)}catch{p.photos=[]}}if(!Array.isArray(p.photos))p.photos=[]}
  all.push(...batch);if(batch.length<1000)break;
 }
 return all;
}
function smartSearch(q){
 let text=norm(q),from=null,to=null,kind='';
 let m=text.match(/entre\s+(\d+(?:[.,]\d+)?)\s+(?:y|a)\s+(\d+(?:[.,]\d+)?)(?:\s*millones?)?/);
 if(m){from=Number(m[1].replace(',','.'))*1e6;to=Number(m[2].replace(',','.'))*1e6;text=text.replace(m[0],' ')}
 m=text.match(/(?:menos de|hasta|maximo|por debajo de)\s*\$?\s*(\d+(?:[.,]\d+)?)(?:\s*millones?)?/);
 if(m){to=Number(m[1].replace(',','.'))*1e6;text=text.replace(m[0],' ')}
 m=text.match(/(?:mas de|desde|minimo|por encima de)\s*\$?\s*(\d+(?:[.,]\d+)?)(?:\s*millones?)?/);
 if(m){from=Number(m[1].replace(',','.'))*1e6;text=text.replace(m[0],' ')}
 for(const [regex,type] of [[/\b(apartamentos?|aptos?|apartaestudios?)\b/g,'Apartamentos'],[/\b(casa finca|casas fincas|casas?)\b/g,'Casas'],[/\b(lotes?|terrenos?)\b/g,'Lotes'],[/\b(fincas?)\b/g,'Fincas'],[/\b(locales?)\b/g,'Locales'],[/\b(bodegas?)\b/g,'Bodegas']]){
  if(regex.test(text)){kind=type;text=text.replace(regex,' ');break}
 }
 // El municipio se puede buscar por palabras, incluso escribiendo "La Ceja" o "El Retiro".
 const tokens=text.replace(/\b(en|de|del|la|el|los|las|un|una|por|precio|valor|millones|millon|pesos|cop|quiero|busco|buscar|venta|comprar|con)\b/g,' ').split(/\s+/).filter(Boolean);
 return {from,to,kind,tokens};
}
function filteredPublic(){
 const get=id=>document.getElementById(id)?.value||'';
 const parsed=smartSearch(get('publicSearch')),kind=get('publicType'),city=get('publicCity'),zone=get('publicZone'),min=get('publicMin'),max=get('publicMax');
 const from=min!==''?Number(min)*1e6:parsed.from,to=max!==''?Number(max)*1e6:parsed.to;
 return publicProperties.filter(p=>{
  const price=Number(p.price),str=norm([p.title,p.type,p.city,p.neighborhood,p.description].join(' '));
  if(kind&&typeGroup(p)!==kind)return false;
  if(parsed.kind&&typeGroup(p)!==parsed.kind)return false;
  if(city&&norm(p.city)!==norm(city))return false;
  if(zone&&norm(p.neighborhood)!==norm(zone))return false;
  if(from!==null&&(!p.price||!Number.isFinite(price)||price<from))return false;
  if(to!==null&&(!p.price||!Number.isFinite(price)||price>to))return false;
  return parsed.tokens.every(t=>str.includes(t));
 });
}

async function loadRelatedProperties(p){
 const target=document.getElementById('relatedProperties');if(!target)return;
 try{
  const properties=await fetchPublished();
  const score=x=>2*Number(typeGroup(x)===typeGroup(p))+Number(norm(x.city)===norm(p.city));
  const related=properties.filter(x=>x.id!==p.id).sort((a,b)=>score(b)-score(a)).slice(0,3);
  target.innerHTML=related.length?related.map(x=>`<a href="?p=${encodeURIComponent(x.id)}&v=brand">${x.photos?.[0]?`<img src="${esc(x.photos[0])}" loading="lazy" alt="Foto de ${esc(x.title)}">`:''}<strong>${esc(x.title)}</strong><span>${fmt(x.price)}</span></a>`).join(''):'<p class="muted">Pronto tendremos más inmuebles disponibles.</p>';
 }catch{target.innerHTML='<p class="muted">Consulta las demás propiedades desde el catálogo.</p>'}
}

ink">${I('copy')} Copiar enlace</button>`:`<button class="btn" data-action="copytext">${I('copy')} Copiar descripción</button>`}<button class="btn" data-action="openpublic" ${!ready?'disabled':''}>${I('view')} Abrir ficha pública con fotos</button><button class="btn" data-action="downloadsheet">${I('download')} Descargar ficha con fotos</button></div></div></div>`}

function stateTextLines(ctx,text,maxWidth,maxLines){const words=String(text||'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean),out=[];let line='';for(const w of words){const trial=line?line+' '+w:w;if(ctx.measureText(trial).width>maxWidth&&line){out.push(line);line=w;if(out.length>=maxLines)break}else line=trial}if(line&&out.length<maxLines)out.push(line);if(out.length>=maxLines&&words.join(' ')!==out.join(' ')){let last=out.length-1;while(out[last]&&ctx.measureText(out[last]+'…').width>maxWidth)out[last]=out[last].slice(0,-1);out[last]+='…'}return out}
function stateImageLoad(src){return new Promise((resolve,reject)=>{const image=new Image();image.crossOrigin='anonymous';image.onload=()=>resolve(image);image.onerror=()=>reject(Error('No se pudo cargar la fotografía principal.'));image.src=src;})}
function stateCrop(ctx,img,x,y,w,h){const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)throw Error('Fotografía no válida');const scale=Math.max(w/iw,h/ih),sw=w/scale,sh=h/scale;ctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h)}
function stateCanvasBlob(canvas){return new Promise((resolve,reject)=>{try{canvas.toBlob(b=>b?resolve(b):reject(Error('No se pudo crear el archivo JPEG.')),'image/jpeg',.9)}catch(e){reject(Error('El servidor de fotografías no permite crear la imagen.'))}})}
async function buildStateImage(p){if(!p.photos?.[0])throw Error('Agrega primero una fotografía principal al inmueble.');const photo=await stateImageLoad(p.photos[0]);const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const c=canvas.getContext('2d');if(!c)throw Error('Tu navegador no permite generar imágenes.');
 c.fillStyle='#12161d';c.fillRect(0,0,1080,1920);stateCrop(c,photo,0,0,1080,1190);
 // Transicion sutil entre fotografía y pie para mantener la lectura.
 const grad=c.createLinearGradient(0,970,0,1240);grad.addColorStop(0,'rgba(18,22,29,0)');grad.addColorStop(1,'#12161d');c.fillStyle=grad;c.fillRect(0,970,1080,270);
 c.fillStyle='#cda95f';c.fillRect(64,1236,8,65);c.fillStyle='#eed8a7';c.font='700 30px Arial,sans-serif';c.fillText('OROGRIS  ·  SOLUCIONES INMOBILIARIAS',92,1272);
 c.fillStyle='#f9f9f6';c.font='700 52px Arial,sans-serif';const titleLines=stateTextLines(c,p.title||'Inmueble disponible',940,2);titleLines.forEach((line,i)=>c.fillText(line,65,1360+i*63));
 c.fillStyle='#e6c47c';c.font='bold 76px Arial,sans-serif';let price=fmt(p.price);if(c.measureText(price).width>950)c.font='bold 62px Arial,sans-serif';c.fillText(price,65,1515);
 c.fillStyle='#e4e6e9';c.font='34px Arial,sans-serif';const where=[p.city,p.neighborhood].filter(Boolean).join(' · ');if(where){stateTextLines(c,where,950,1).forEach(t=>c.fillText(t,65,1583))}
 c.fillStyle='#c6cbd0';c.font='32px Arial,sans-serif';const details=stateDetails(p);if(details)c.fillText(details,65,1640);
 c.fillStyle='#edf0f1';c.font='30px Arial,sans-serif';const description=String(p.description||'').replace(/\s+/g,' ').trim();const text=description||'Consulta las fotografías y características de este inmueble.';stateTextLines(c,text,947,2).forEach((line,i)=>c.fillText(line,65,1705+42*i));
 c.fillStyle='#323942';c.fillRect(0,1818,1080,2);c.fillStyle='#ddc28a';c.font='bold 31px Arial,sans-serif';c.fillText('VER FOTOS Y DETALLES EN EL ENLACE DEL ESTADO',65,1874);
 return stateCanvasBlob(canvas)}

function shareStatusLink(id){const p=items.find(x=>x.id===id);if(!p)return;selectedItem=id;
 if(!publicSiteReady()||p.status==='Borrador'){modal='state';render();return}
 const url=getStatusShareUrl(p);
 const detail=[p.area?`${p.area} m²`:'',p.rooms?`${p.rooms} hab.`:'',p.baths?`${p.baths} baños`:''].filter(Boolean).join(' · ');
 const text=[`${p.title} — ${fmt(p.price)}`,detail].filter(Boolean).join(' | ');
 if(typeof navigator.share==='function'){
   try{const result=navigator.share({title:`${p.title} · ${fmt(p.price)}`,text,url});
    Promise.resolve(result).catch(err=>{if(err?.name!=='AbortError'){modal='state';render();toast('Puedes copiar el enlace para pegarlo en tu estado.')}});
   }catch(err){modal='state';render();toast('Puedes copiar el enlace para pegarlo en tu estado.')}
 } else {modal='state';render()}
}

// IndexedDB: admite muchas más fotos que localStorage. Guardar y restaurar JSON sigue siendo recomendable.
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('orogris_inmobiliaria_v3',1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('properties'))d.createObjectStore('properties',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function idbAll(){return new Promise((resolve,reject)=>{let req=db.transaction('properties','readonly').objectStore('properties').getAll();req.onsuccess=()=>resolve(req.result.sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||''))));req.onerror=()=>reject(req.error)})}
function idbPut(p){return new Promise((resolve,reject)=>{let tx=db.transaction('properties','readwrite');tx.objectStore('properties').put(p);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function idbDelete(id){return new Promise((resolve,reject)=>{let tx=db.transaction('properties','readwrite');tx.objectStore('properties').delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function authHeaders(token=null,contentType='application/json'){const h={'apikey':settings.key};if(token)h.Authorization='Bearer '+token;else if(!settings.key.startsWith('sb_'))h.Authorization='Bearer '+settings.key;if(contentType)h['Content-Type']=contentType;return h}
async function sb(path,opt={}){if(!settings.url||!settings.key)throw Error('Falta conectar Supabase en Configuración');const rsp=await fetch(settings.url.replace(/\/$/,'')+path,{...opt,headers:{...authHeaders(session?.access_token,opt.blob?'':undefined),...(opt.headers||{})}});if(!rsp.ok){let t=await rsp.text();throw Error(t.slice(0,400)||`Error HTTP ${rsp.status}`)}if(rsp.status===204)return null;let t=await rsp.text();try{return JSON.parse(t)}catch{return t}}
async function authLogin(email,password){const rsp=await fetch(settings.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password})});if(!rsp.ok)throw Error('Correo o contraseña incorrectos, o cuenta no creada en Supabase.');const s=await rsp.json();s.expires_at=Date.now()+s.expires_in*1000;session=s;localStorage.setItem(TOKEN,JSON.stringify(s));}
async function refreshSession(){if(!session)return false;if(session.expires_at-Date.now()>60000)return true;try{const rsp=await fetch(settings.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:authHeaders(),body:JSON.stringify({refresh_token:session.refresh_token})});if(!rsp.ok)throw Error('sesión expirada');session=await rsp.json();session.expires_at=Date.now()+session.expires_in*1000;localStorage.setItem(TOKEN,JSON.stringify(session));return true}catch{session=null;localStorage.removeItem(TOKEN);return false}}

async function uploadPhoto(p,id){const blob=await(await fetch(p)).blob();const mime='image/jpeg';const path=`${session.user.id}/${id}/${crypto.randomUUID()}.jpg`;let rsp=await fetch(settings.url.replace(/\/$/,'')+'/storage/v1/object/property-photos/'+path,{method:'POST',headers:{...authHeaders(session.access_token,''),'Content-Type':mime,'x-upsert':'false'},body:blob});if(!rsp.ok)throw Error('No fue posible subir una fotografía: '+(await rsp.text()).slice(0,180));return settings.url.replace(/\/$/,'')+'/storage/v1/object/public/property-photos/'+path}

function compress(f){return new Promise((resolve,reject)=>{if(!f.type.startsWith('image/'))return reject(Error('Archivo no es una imagen'));const reader=new FileReader();reader.onerror=()=>reject(Error('No fue posible leer imagen'));reader.onload=()=>{let img=new Image();img.onerror=()=>reject(Error('Imagen no soportada'));img.onload=()=>{let ratio=Math.min(1,1600/img.width,1600/img.height);let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(f)})}

function extract(t){let obj={};t=t.trim();if(!t)return obj;try{let src=JSON.parse(t.replace(/^```(?:json)?\s*|\s*```$/g,''));if(src&&typeof src==='object'){const map={title:['title','titulo','nombre'],type:['type','tipo'],price:['price','precio'],city:['city','ubicacion','municipio'],neighborhood:['neighborhood','barrio','sector'],area:['area','area_m2','metros'],rooms:['rooms','habitaciones','alcobas'],baths:['baths','banos','baños'],parking:['parking','parqueaderos'],description:['description','descripcion']};for(let [dst,keys] of Object.entries(map)){let k=keys.find(k=>src[k]!=null);if(k)obj[dst]=src[k]};return obj}}catch{};
 const capture=(r)=>t.match(r)?.[1];
 const kind=capture(/\b(apartaestudio|apartamento|casa\s*finca|casa|lote|local|finca|bodega)\b/i);
 const city=capture(/\b(?:en|ubicad[ao]\s+en|ubicaci[oó]n\s*:?\s*)(La\s+Ceja|Rionegro|El\s+Retiro|Marinilla|Medell[ií]n|Guarne|El\s+Carmen\s+de\s+Viboral|Sons[oó]n)\b/i);
 const size=capture(/(?:área|area|construidos?|metros\s+cuadrados|mide)\s*(?:de|:)?\s*(\d{2,5}(?:[.,]\d{1,2})?)/i)||capture(/\b(\d{2,5}(?:[.,]\d{1,2})?)\s*(?:m²|m2|mts?\b|metros\s+cuadrados)/i);
 const rooms=capture(/\b(\d{1,2})\s*(?:habitaciones?|alcobas?|cuartos?)\b/i)||capture(/(?:habitaciones?|alcobas?|cuartos?)\s*:?\s*(\d{1,2})/i);
 const baths=capture(/\b(\d{1,2})\s*baños?\b/i)||capture(/baños?\s*:?\s*(\d{1,2})/i);
 const parking=capture(/\b(?:garaje|parqueadero|garage)\s*(?:para|de)?\s*(\d{1,2})\s*(?:carros?|veh[ií]culos?)?/i)||capture(/\b(\d{1,2})\s*(?:parqueaderos?|garajes?)\b/i);
 let pricem=t.match(/(?:precio|valor|venta|\$)\s*(?:de|:|\$)?\s*\$?\s*(\d[\d.,\s]*)\s*(millones?|mill|mm|m\b)?/i);if(!pricem)pricem=t.match(/\b(\d{2,4}(?:[.,]\d{1,2})?)\s*(millones?|mill|mm)\b/i);
 let price;if(pricem){let raw=pricem[1].trim().replace(/\s/g,'');if(pricem[2])price=Math.round(parseFloat(raw.replace(',','.'))*1e6);else{let val=+raw.replace(/[,.]/g,'');if(val>=10000000)price=val;else if(val>=100&&val<=9999)price=val*1e6}};
 if(kind)obj.type=kind[0].toUpperCase()+kind.slice(1).toLowerCase();if(city)obj.city=city+', Antioquia';if(size)obj.area=+size.replace(',','.');if(rooms)obj.rooms=+rooms;if(baths)obj.baths=+baths;if(parking)obj.parking=+parking;if(price&&Number.isFinite(price))obj.price=price;obj.title=(obj.type||'Inmueble')+(city?' en '+city:'');obj.description=t;return obj}

function shareChooseBusiness(s){
  if(typeof navigator.share==='function'){
    const payload=/^https?:\/\//i.test(s)?{url:s}:{text:s};
    try{
      Promise.resolve(navigator.share(payload)).catch(err=>{
        if(err?.name!=='AbortError')toast('No se pudo compartir. Usa «Copiar enlace» y pégalo en WhatsApp Business.');
      });
    }catch(err){toast('Usa «Copiar enlace» y pégalo en WhatsApp Business.')}
    return;
  }
  // En computadores sin menú Compartir se mantiene el método previo.
  openWa(s);
}
function openBusinessDirect(s){
  if(IS_IOS){
    // Esquema de aplicación de WhatsApp Business: puede depender de iOS/Safari.
    // Si iOS no lo abre, el usuario tiene siempre el menú Compartir como alternativa.
    try{window.location.href='whatsapp-business://send?text='+encodeURIComponent(s)}
    catch(err){toast('Usa «Compartir: elegir WhatsApp Business».')}
    return;
  }
  // Otros dispositivos: compartir con el menú del sistema si está disponible.
  shareChooseBusiness(s);
}

document.addEventListener('change',async e=>{if(e.target.id==='f_photos'){await addPhotos(e.target.files);e.target.value=''}if(e.target.id==='importPhotos'){tempFiles=[...e.target.files];$('#importStatus').textContent=tempFiles.length+' fotografía(s) seleccionadas';let prev=await Promise.all(tempFiles.slice(0,24).map(f=>compress(f).catch(()=>'')));$('#importThumbs').innerHTML=thumbs(prev.filter(Boolean));}if(e.target.id==='restoreFile'&&e.target.files[0])await restoreBackup(e.target.files[0]);if(e.target.id==='statusFilter'){filterStatus=e.target.value;render()}if(['publicType','publicCity','publicZone'].includes(e.target.id)){drawPublicCatalog()}});
document.addEventListener('input',e=>{if(['publicSearch','publicMin','publicMax'].includes(e.target.id)){drawPublicCatalog();return}if(e.target.id==='search'){searchTerm=e.target.value;let list=items.filter(p=>(filterStatus==='all'||p.status===filterStatus)&&[p.title,p.city,p.neighborhood,p.description].join(' ').toLowerCase().includes(searchTerm.toLowerCase()));$('#propertyGrid').innerHTML=cards(list)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){if(modal==='state')clearStateImage();modal='';render()}});
init();
</script>
</body></html>
